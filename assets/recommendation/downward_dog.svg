<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" rx="28" fill="url(#g)"/>
  <circle cx="380" cy="70" r="42" fill="#818cf8" fill-opacity="0.25"/>
  <circle cx="110" cy="90" r="30" fill="#a78bfa" fill-opacity="0.18"/>
  <rect x="110" y="90" width="260" height="120" rx="20" fill="#1f2937" fill-opacity="0.85"/>
  <!-- Mat -->
  <path d="M90 200 L390 200" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
  <!-- Inverted V Shape -->
  <!-- Legs to Hips -->
  <path d="M140 200 L240 100" stroke="#e5e7eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hips to Arms -->
  <path d="M240 100 L330 200" stroke="#c084fc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Head hanging down -->
  <circle cx="275" cy="150" r="14" fill="#f5f3ff"/>
  <text x="240" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#e0e7ff">Downward Dog</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#581c87"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" rx="28" fill="url(#g)"/>
  <circle cx="380" cy="70" r="42" fill="#d8b4fe" fill-opacity="0.25"/>
  <circle cx="110" cy="90" r="30" fill="#fb7185" fill-opacity="0.18"/>
  <rect x="110" y="100" width="260" height="110" rx="20" fill="#1f2937" fill-opacity="0.85"/>
  <!-- Mat -->
  <path d="M90 200 L390 200" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
  <!-- Straight body -->
  <path d="M130 190 L330 110" stroke="#e5e7eb" stroke-width="6" stroke-linecap="round"/>
  <!-- Arms straight down -->
  <path d="M310 200 L310 118" stroke="#c084fc" stroke-width="6" stroke-linecap="round"/>
  <!-- Legs straight down slightly at toes -->
  <path d="M135 200 L130 190" stroke="#e5e7eb" stroke-width="6" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="342" cy="105" r="14" fill="#f5f3ff"/>
  <text x="240" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#faf5ff">Plank Pose</text>
</svg>

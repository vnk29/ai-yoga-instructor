<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Streamlit Custom Camera</title>
    <style>
      body { 
        margin: 0; 
        padding: 0; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        background: transparent; 
        font-family: sans-serif; 
      }
      .video-container {
        position: relative;
        width: 100%;
        max-width: 640px;
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid #8b5cf6;
        background: #111827;
      }
      video { 
        width: 100%; 
        transform: scaleX(-1); /* Mirror effect */
        display: block;
      }
      /* Hidden canvas for capturing frames */
      #captureCanvas { display: none; }
      
      /* Visible canvas for drawing AI overlay */
      #overlayCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none; /* Let clicks pass through to video if needed */
        transform: scaleX(-1); /* Match video mirror so coordinates align naturally, but wait: text will be backwards if mirrored. We should handle mirroring in JS logic or flip context for text. */
      }
      
      .controls { 
        margin-top: 15px; 
      }
      button { 
        padding: 10px 20px; 
        background: #8b5cf6; 
        color: white; 
        border: none; 
        border-radius: 6px; 
        cursor: pointer; 
        font-size: 16px;
        font-weight: 600;
        transition: background 0.2s;
      }
      button:hover { background: #7c3aed; }
      button.active { background: #ef4444; }
      button.active:hover { background: #dc2626; }
    </style>
  </head>
  <body>
    <div class="video-container">
      <video id="video" autoplay playsinline></video>
      <canvas id="overlayCanvas"></canvas>
    </div>
    <canvas id="captureCanvas"></canvas>
    
    <div class="controls">
      <button id="toggleBtn">Start Live Camera</button>
    </div>
    
    <script>
      // ----------------------------------------------------
      // Streamlit Custom Component Boilerplate
      // ----------------------------------------------------
      function sendMessageToStreamlitClient(type, data) {
        const outData = Object.assign({
          isStreamlitMessage: true,
          type: type,
        }, data);
        window.parent.postMessage(outData, "*");
      }

      function init() {
        sendMessageToStreamlitClient("streamlit:componentReady", {apiVersion: 1});
      }

      function setFrameHeight(height) {
        sendMessageToStreamlitClient("streamlit:setFrameHeight", {height: height});
      }

      function sendDataToPython(data) {
        sendMessageToStreamlitClient("streamlit:setComponentValue", {value: data});
      }

      // ----------------------------------------------------
      // Overlay Drawing Logic
      // ----------------------------------------------------
      const overlayCanvas = document.getElementById('overlayCanvas');
      const overlayCtx = overlayCanvas.getContext('2d');
      
      // We flip the canvas horizontally because the video is mirrored.
      // But we must un-flip before drawing text, otherwise text is backwards.
      function drawOverlay(data) {
        if (!data || !video.videoWidth) return;
        
        // Ensure canvas matches video dimensions
        if (overlayCanvas.width !== video.videoWidth || overlayCanvas.height !== video.videoHeight) {
          overlayCanvas.width = video.videoWidth;
          overlayCanvas.height = video.videoHeight;
        }
        
        const w = overlayCanvas.width;
        const h = overlayCanvas.height;
        
        overlayCtx.clearRect(0, 0, w, h);
        
        // Draw Skeleton (Points and Lines)
        if (data.lines && data.points) {
          // Flip context for skeleton because video is visually flipped via CSS, 
          // but coordinates from MediaPipe assume the unflipped image.
          // Wait, if Python processes the UNFLIPPED image, the coordinates are UNFLIPPED.
          // Since the CSS scales X by -1, the canvas is ALSO flipped visually if we don't do anything.
          // Let's remove the CSS transform from canvas and just flip X in JS.
          
          overlayCtx.save();
          // We will draw normally, but we flip X coordinates.
          
          overlayCtx.lineWidth = 3;
          overlayCtx.strokeStyle = "rgba(200, 200, 50, 0.8)";
          
          // Lines
          data.lines.forEach(line => {
            const x1 = (1.0 - line[0]) * w; // Flip X
            const y1 = line[1] * h;
            const x2 = (1.0 - line[2]) * w; // Flip X
            const y2 = line[3] * h;
            
            overlayCtx.beginPath();
            overlayCtx.moveTo(x1, y1);
            overlayCtx.lineTo(x2, y2);
            overlayCtx.stroke();
          });
          
          // Points
          overlayCtx.fillStyle = "rgba(50, 200, 50, 0.9)";
          data.points.forEach(pt => {
            const x = (1.0 - pt[0]) * w; // Flip X
            const y = pt[1] * h;
            
            overlayCtx.beginPath();
            overlayCtx.arc(x, y, 4, 0, 2 * Math.PI);
            overlayCtx.fill();
          });
          
          overlayCtx.restore();
        }
        
        // Draw HUD
        if (data.hud) {
          overlayCtx.save();
          // Text is NOT flipped
          
          // Warning Background (Top)
          if (data.hud.warning) {
            overlayCtx.fillStyle = "rgba(220, 38, 38, 0.9)"; // Red
            overlayCtx.fillRect(0, 0, w, 60);
            overlayCtx.fillStyle = "white";
            overlayCtx.font = "bold 24px sans-serif";
            overlayCtx.fillText(data.hud.warning, 15, 38);
          }
          
          // HUD Background (Bottom)
          overlayCtx.fillStyle = "rgba(17, 24, 39, 0.85)"; // Dark gray
          overlayCtx.fillRect(0, h - 60, w, 60);
          
          // Top mini HUD (Pose name)
          if (!data.hud.warning && data.hud.pose) {
             overlayCtx.fillStyle = "rgba(17, 24, 39, 0.85)";
             overlayCtx.fillRect(0, 0, w, 50);
             overlayCtx.fillStyle = "#fc84c0"; // Pinkish
             overlayCtx.font = "bold 22px sans-serif";
             overlayCtx.fillText("Pose: " + data.hud.pose, 15, 33);
          }
          
          // Bottom stats
          if (data.hud.confidence) {
             overlayCtx.fillStyle = "#b672f4"; // Purple
             overlayCtx.font = "bold 18px sans-serif";
             overlayCtx.fillText("Confidence: " + data.hud.confidence, 15, h - 35);
          }
          
          if (data.hud.stability || data.hud.hold) {
             overlayCtx.fillStyle = "#81b910"; // Green
             overlayCtx.font = "16px sans-serif";
             overlayCtx.fillText(
               "Stability: " + (data.hud.stability || "0%") + "  |  Hold: " + (data.hud.hold || "0.0s"), 
               15, h - 12
             );
          }
          
          overlayCtx.restore();
        }
      }

      window.addEventListener("message", function(event) {
        if (event.data.type === "streamlit:render") {
          // Frame height is now fixed from the Python side
          
          // Read overlay data passed from Python
          if (event.data.args && event.data.args.overlay) {
            drawOverlay(event.data.args.overlay);
          }
        }
      });

      // ----------------------------------------------------
      // Camera App Logic
      // ----------------------------------------------------
      const video = document.getElementById('video');
      const captureCanvas = document.getElementById('captureCanvas');
      const ctx = captureCanvas.getContext('2d');
      const toggleBtn = document.getElementById('toggleBtn');
      
      // Ensure overlay canvas doesn't flip visually via CSS
      overlayCanvas.style.transform = "none";
      
      let stream = null;
      let captureInterval = null;
      let isPlaying = false;

      toggleBtn.addEventListener('click', async () => {
        if (!isPlaying) {
          try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
            video.srcObject = stream;
            isPlaying = true;
            toggleBtn.textContent = "Stop Camera";
            toggleBtn.classList.add('active');
            
            // Wait for video to be ready before starting interval
            video.onloadedmetadata = () => {
                // Clear overlay when starting
                overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
                
                // Start capturing frames every 250ms (4 FPS) for slightly faster response
                captureInterval = setInterval(() => {
                  if (video.videoWidth) {
                    captureCanvas.width = video.videoWidth;
                    captureCanvas.height = video.videoHeight;
                    
                    ctx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
                    
                    // Export as JPEG (quality 0.5) to keep websocket payload extremely small
                    const base64Data = captureCanvas.toDataURL('image/jpeg', 0.5);
                    
                    sendDataToPython(base64Data);
                  }
                }, 250);
            };

          } catch (err) {
            console.error("Camera access denied:", err);
            toggleBtn.textContent = "Camera Permission Denied";
            toggleBtn.style.background = "#ef4444";
          }
        } else {
          // Stop stream
          if (stream) stream.getTracks().forEach(track => track.stop());
          clearInterval(captureInterval);
          isPlaying = false;
          toggleBtn.textContent = "Start Live Camera";
          toggleBtn.classList.remove('active');
          
          overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
          sendDataToPython(null);
        }
      });

      // Tell Streamlit we are ready!
      init();
    </script>
  </body>
</html>
